method: searched
source: >-
  https://docs.arcadia.com/v2022-12-21-Signal/reference/requests,
  https://docs.arcadia.com/v2022-12-21-Signal/reference/responses,
  https://docs.arcadia.com/v2022-12-21-Signal/reference/dates-times,
  https://docs.arcadia.com/v2022-12-21-Signal/reference/authentication,
