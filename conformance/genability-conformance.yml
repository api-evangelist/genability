summary: >-
  Signal conforms to almost nothing beyond OpenAPI 3.1 and HTTP Basic over TLS.
  The energy-sector data standards were swept for explicitly (Green Button,
  ESPI, OpenADR, IEEE 2030.5, IEC 61968/CIM, NAESB, Consumer Data Right): zero
  matches in the documentation and zero in the contract. Genability implements a
  proprietary tariff data model. No compliance certification (SOC 2, ISO 27001,
  PCI DSS, HIPAA, FedRAMP) is claimed for Genability or Arcadia themselves — the
  corporate security page cites only its VENDORS' certifications (AWS, Stripe,
  Plaid), so no Compliance pointer is wired.
