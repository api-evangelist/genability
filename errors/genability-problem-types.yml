rfc9457: false
summary: >-
  Signal does not use RFC 9457 problem+json. Every error — protocol or
  application — is returned in the same JSON wrapper as a success, with
  status="error", type="Error" and one Error object per problem in results[].
  There is no published enumeration of error `code` values; the codes below are
  the ones Genability publishes in its reference examples, its Simulate Errors
  endpoint, and the live 401 the API returns anonymously.
envelope:
  content_type: application/json
  fields:
    status: error
    count: number of Error objects in results
    type: Error
    results: array of Error objects
  error_object:
    code: Unique string identifying the error type.
    message: Localized, user-readable message describing the error.
    objectName: Object type related to the error.
    propertyName: Object property related to the error.
  example: |-
    {
      "status": "error",
      "count": 2,
      "type": "Error",
      "results": [
        {
          "code": "NotNull",
          "message": "An appKey must be supplied",
          "objectName": "requestSignature",
          "propertyName": "appKey"
        },
        {
          "code": "NotNull",
          "message": "An appId must be supplied",
          "objectName": "requestSignature",
          "propertyName": "appId"
        }
      ]
    }
