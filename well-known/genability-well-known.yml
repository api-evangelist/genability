summary: >-
  Genability publishes no /.well-known/ discovery surface. Every path on the API
  host returns the standard Signal Unauthorized envelope (HTTP 401) because the
  gateway authenticates before routing — including /.well-known/security.txt and
  /.well-known/openid-configuration — so no anonymous discovery document is
  reachable. The documentation host returns 404. genability.com returns HTTP 200
  for any /.well-known/ path but the body is the Arcadia marketing SPA shell
  (<!DOCTYPE html>), i.e. a soft-404, NOT a security.txt: recorded as
  not-published, not as a hit. No security.txt, no OIDC/OAuth metadata, no
  api-catalog and no ai-plugin.json exist for this provider. Absence is valid
  data.
