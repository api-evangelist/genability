  TypeScript/JavaScript SDK on npm as @genability/api and the Java client on
  Maven Central as com.genability:genability-client. The PHP library is
  first-party but distributed only from GitHub (no Packagist package). The Ruby
  gem is explicitly labelled third-party by Arcadia's own Tools and Libraries
  page. No Python, Go, .NET, Rust or PHP registry package exists — PyPI
  (genability), Packagist (genability) and pkg.go.dev searches all returned no
  first-party result.
