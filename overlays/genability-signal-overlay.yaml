  added by API Evangelist; no operation, parameter or response was invented.
actions:
- target: $.info
  description: Annotate the document with API Evangelist provenance.
  update:
    x-apievangelist-provider: genability
    x-apievangelist-harvested: '2026-07-27'
    x-apievangelist-source: https://docs.arcadia.com/v2022-12-21-Signal/reference/get-tariff (embedded api.schema)
    description: 'Arcadia Platform - Signal: North American electricity tariff, utility and rate reference data
      plus an on-demand bill-calculation engine, served from api.genability.com. Every endpoint requires HTTP Basic
      credentials (appId as username, appKey as password); the /rest/public/ paths are non-org-scoped reference
      data, not anonymous.'
- target: $.servers[0]
  description: Name the single production server.
  update:
    description: Production (the only environment; there is no sandbox host)
- target: $.components.securitySchemes.sec0
  description: Describe the Basic auth scheme in the terms the docs use.
  update:
    description: HTTP Basic authentication. Username = appId, password = appKey. Create both at https://dash.genability.com/org/applications.
      Validate with GET /rest/echo/authenticate.
- target: $
  description: Declare the tag set API Evangelist derived from the Signal API families (the original document declares
    no tags).
  update:
    tags:
    - name: Echo
      description: 'Testing and debugging endpoints: validate credentials, validate input formats, simulate errors.'
    - name: Tariffs
      description: Search, retrieve and version-history North American electricity tariffs.
    - name: Load Serving Entities
      description: Utilities — investor-owned, municipal and cooperative — serving the USA, Canada and Mexico.
    - name: Territories
      description: Service, baseline, climate and tariff-applicability geographies.
    - name: Seasons
      description: Seasonal definitions used when a tariff prices summer and winter differently.
    - name: Time of Use
      description: TOU groups, TOU definitions and their interval schedules.
    - name: Calendars
      description: Holiday and special-day schedules that drive rate periods.
    - name: Properties
      description: Property keys, lookup values and lookup statistics.
    - name: Calculations
      description: On-demand and mass bill calculation against any tariff.
    - name: Smart Price
      description: Single blended $/kWh price signal for a utility, tariff and window.
    - name: Utility Taxes
      description: Jurisdictional taxes applied to a modeled electricity bill.
    - name: Typical Baseline
      description: Best-fit modeled load profiles when real interval data is unavailable.
    - name: ZIP Codes
      description: ZIP/postal code detail and the utilities and territories that serve it.
    - name: Organization Usage
      description: Month-to-date Signal API consumption for your organization.
