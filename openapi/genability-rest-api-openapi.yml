  /rest/public/lses:
    get:
      summary: List LSEs
      description: Return a full or filtered list of Load Serving Entities (LSEs).
      operationId: get-lses
      parameters:
      - name: searchOn
        in: query
        description: This is from the standard searching and sorting parameters. You can search within one or more of the attributes within the LSE object (see above).
        schema:
          type: string
      - name: zipCode
        in: query
        description: Zip or post code where you would like to see a list of LSEs for (e.g. 5 digit ZIP code for USA). Most countries have regional, not national, Utility Service Areas. When populating this field you should also populate country too. (Recommended)
        schema:
          type: string
      - name: postCode
        in: query
        description: Alias for zipCode, you can use either.
        schema:
          type: string
      - name: country
        in: query
        description: Use an ISO Country Code when passing in a zipCode or postCode, and set it to the ISO Country Code of your zipCode or postCode since some countries use the same format
        schema:
          type: string
      - name: ownerships
        in: query
        description: Filter results by the type of ownership structure for the LSE. Values include "INVESTOR", "COOP", "MUNI", but see ownership field above for complete list.
        schema:
          type: array
          items:
            type: string
      - name: serviceTypes
        in: query
        description: Filter results to LSEs that just offer this service type to a customer class. Valid values include "ELECTRICITY" and "SOLAR_PV"
        schema:
          type: array
          items:
            type: string
      - name: residentialServiceTypes
        in: query
        description: Filter results to LSEs that just offer this service type to their residential customers. Valid values include "ELECTRICITY" and "SOLAR_PV"
        schema:
          type: array
          items:
            type: string
      - name: commercialServiceTypes
        in: query
        description: Filter results to LSEs that just offer this service type to their commercial (business) customers. Valid values include "ELECTRICITY" and "SOLAR_PV"
        schema:
          type: array
          items:
            type: string
      - name: industrialServiceTypes
        in: query
        description: Filter results to LSEs that just offer this service type to their industrial customers. Valid values include "ELECTRICITY" and "SOLAR_PV"
        schema:
          type: array
          items:
            type: string
      - name: transportationServiceTypes
        in: query
        description: Filter results to LSEs that just offer this service type to their transportation customers. Valid values include "ELECTRICITY" and "SOLAR_PV" (Optional).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
