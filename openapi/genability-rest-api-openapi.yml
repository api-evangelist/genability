  /rest/v1/typicals/baselines/best:
    get:
      summary: Get Best Typical Baseline
      description: Retrieve the baseline that best fits the provided location, building type, and optional building details.
      operationId: typical-baseline-api
      parameters:
      - name: zipCode
        in: query
        description: The zip code or postal code we will use to look up local buildings.
        schema:
          type: string
      - name: country
        in: query
        description: The ISO country code. Use in conjunction with zipCode | postCode parameters.
        schema:
          type: string
      - name: addressString
        in: query
        description: The address string we will geo-tag (isolate latitude & longitude) to look up local buildings.
        schema:
          type: string
      - name: lat
        in: query
        description: Latitude to look up. Use in concert with lng if you choose this method.
        schema:
          type: number
          format: double
      - name: lng
        in: query
        description: Longitude to look up. Use in concert with lat if you choose this method.
        schema:
          type: number
          format: double
      - name: customerClass
        in: query
        description: The class of customer, which is one of RESIDENTIAL, GENERAL, or SPECIAL_USE.
        schema:
          type: string
      - name: buildingType
        in: query
        description: The building type that best describes this building. Use RESIDENTIAL for a residential default or one of the more explicit choices returned from the property key buildingTypeResidential or buildingTypeCommercial.
        schema:
          type: string
      - name: serviceType
        in: query
        description: This is currently limited to ELECTRICITY.
        schema:
          type: string
      - name: buildingArea
        in: query
        description: If you have the site footprint, pass in size of the building in square feet. If this is not passed directly we will default to the average for the region and buildingType.
        schema:
          type: integer
          format: int64
      - name: buildingVintage
        in: query
        description: The construction year of the building, options include Pre1980, Post1980 (1980 - 2003), or New (2003+).
        schema:
          type: string
      - name: excludeMeasures
        in: query
        description: Setting to true will omit the measures (makes the call faster if you don't need this data). Defaults to false.
        schema:
          type: boolean
      - name: measuresUnit
        in: query
        description: By default, we will return total usage per interval. If you ask for intensity we'll convert this into energy intensity (e.g. per square foot or meter). Your final choice is proportion which means that each value in the year will add up to 100.
        schema:
          type: string
      - name: groupBy
        in: query
        description: When supplied the response will roll up measures into this period. Possible values are MONTH, DAY, YEAR.
        schema:
          type: string
      - name: sizingKeyName
        in: query
        description: Pass this parameter when you want to adjust the size of the load. Currently supports loadSize. Used in concert with sizingDataValue and sizingUnit.
        schema:
          type: string
      - name: sizingDataValue
        in: query
        description: This should be set to the quantity to size (e.g. 12000 for 12,000 kWh). (See sizingKeyName above)
        schema:
          type: integer
          format: int32
      - name: sizingUnit
        in: query
        description: This denotes the unit of measure for the accompanying sizingDataValue. Currently, we support only kWh. (See sizingKeyName above)
        schema:
          type: string
      - name: intervalFromDateTime
        in: query
        description: Pass this parameter when you want the "intervals" to be populated from a certain date (e.g. 2024-01-01).
        schema:
          type: string
          format: date
      - name: intervalToDateTime
        in: query
        description: Pass this parameter when you want the "intervals" to be populated to a certain date (e.g. 2025-01-01).
        schema:
          type: string
          format: date
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Rest
