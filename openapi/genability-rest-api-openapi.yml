  /rest/public/tariffs/{masterTariffId}:
    get:
      summary: Get Tariff by MTID
      description: Return tariffs matching the provided filters.
      operationId: get-tariff-1
      parameters:
      - name: effectiveOn
        in: query
        description: Only tariffs that are effective on this date
        schema:
          type: string
          format: date
      - name: openOn
        in: query
        description: Only tariffs that were open (i.e. were not closed to new customers) on this date.
        schema:
          type: string
          format: date
      - name: isActive
        in: query
        description: Only the current, active tariff version for the LSE or master tariff Id.
        schema:
          type: boolean
      - name: fromDateTime
        in: query
        description: Only include tariffs that are effective on or after this date
        schema:
          type: string
          format: date
      - name: toDateTime
        in: query
        description: Only include tariffs that are effective on or before this date
        schema:
          type: string
          format: date
      - name: populateProperties
        in: query
        description: Populates the properties for the returned tariffs
        schema:
          type: boolean
      - name: populateRates
        in: query
        description: Populates the rate details for the returned tariffs
        schema:
          type: boolean
      - name: populateDocuments
        in: query
        description: Populates the document links for the returned tariffs
        schema:
          type: boolean
      - name: bundleRates
        in: query
        description: When true (false by default) the rates are summarized (bundled). Note that this only works for tariffs with a customerClass of RESIDENTIAL.
        schema:
          type: boolean
      - name: applicableRatesOnly
        in: query
        description: When true (false by default) rate applicability criteria will be applied to the rates. You’ll only get back rates that match the requests rate applicability values, or the default rate applicability value as set on the tariff.
        schema:
          type: boolean
      - name: filterRiderRates
        in: query
        description: Used in concert with populateRates = true, when filterRiderRates = true (false by default) rider rates will not be returned. However pointers to the riders will be returned. This is used primarily when using and existing tariff’s structure when creating private tariffs
        schema:
          type: string
      - name: fields
        in: query
        description: ext to return extended fields
        schema:
          type: string
      - in: path
        name: masterTariffId
        schema:
          type: string
        required: true
        description: If specified, all versions of a tariff belonging to the master tariff Id are returned.
      responses:
