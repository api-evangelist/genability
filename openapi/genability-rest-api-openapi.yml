  /rest/v1/prices/smart:
    get:
      summary: Get Smart Price
      description: Retrieve marginal pricing for a location or tariff over a specified time window.
      operationId: smart-price-api
      parameters:
      - name: fromDateTime
        in: query
        description: Start date and time to get prices for. (Optional, Defaults to "now".)
        schema:
          type: string
          format: date
      - name: toDateTime
        in: query
        description: End date and time to get prices for. (Optional, Defaults to fromDateTime plus 3 days.)
        schema:
          type: string
          format: date
      - name: masterTariffId
        in: query
        description: You can use this rather than a location (addressString or zipCode) and customer class. We will use the tariffs information to return its price, or in the case of a smart price request, its applicable Smart Tariffs price (Optional)
        schema:
          type: integer
          format: int64
      - name: zipCode or postCode
        in: query
        description: Recommended way to pass a location. Make sure it’s just the ZIP code or post code though. (Optional)
        schema:
          type: string
      - name: country
        in: query
        description: Use when passing in a postCode or zipCode. Set to the ISO Country Code you require (Optional)
        schema:
          type: string
      - name: addressString
        in: query
        description: An alternate to using postCode or zipCode and can be an address of any kind. Ideally this will contain a ZIP code or post code. (Optional)
        schema:
          type: string
      - name: customerClass
        in: query
        description: Denotes the type of customer and is used to determine the appropriate tariff or smart tariff. (Optional) Defaults to "RESIDENTIAL"
        schema:
          type: string
      - name: endUse
        in: query
        description: Primarily used for smart tariffs. You can use this denote what end use (e.g. appliance, EV, whole home, thermostat etc) the price signal is for. (Optional). You can get the actual values that you can pass in from the property keys residentialEndUse and commercialEndUse
        schema:
          type: string
      - name: groupBy
        in: query
        description: Use to specify the intervals you want the price changes back in. (Optional) When not passed in you get a change record for each actual change in price. Passing in "HOUR" will give hourly prices, even if the price doesn’t change.
        schema:
          type: string
      - name: territoryId
        in: query
        description: Rarely needed. This is the for when a tariff has different rates for different territories (so its not for a utility companies service area territory). Only needed when you want to override the default territory. (Optional)
        schema:
          type: integer
          format: int64
      - name: consumptionAmount
        in: query
        description: A monthly consumption in kWh. This is used for banded consumption to determine which pricing to use for the request. By default, the rate amount calculation assumes the highest banded level of consumption. (Optional)
        schema:
          type: number
          format: double
      - name: demandAmount
        in: query
        description: A monthly demand in kW. This is used for banded demand to determine which pricing to use for the request. By default, the rate amount calculation assumes the highest banded level of demand. (Optional)
        schema:
          type: number
          format: double
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Rest
  /rest/public/tariffs:
    get:
      summary: List Tariffs
      description: Return tariffs matching the provided filters.
      operationId: get-tariff
      parameters:
      - name: lseId
        in: query
        description: Filter tariffs for a specific LSE
        schema:
          type: integer
          format: int64
      - name: masterTariffId
        in: query
        description: If specified, all versions of a tariff belonging to the master tariff Id are returned.
        schema:
          type: integer
          format: int64
      - name: effectiveOn
        in: query
        description: Only tariffs that are effective on this date
        schema:
          type: string
          format: date
      - name: openOn
        in: query
        description: Only tariffs that were open (i.e. were not closed to new customers) on this date.
        schema:
          type: string
          format: date
      - name: isActive
        in: query
        description: Only the current, active tariff version for the LSE or master tariff Id.
        schema:
          type: boolean
      - name: fromDateTime
        in: query
        description: Only include tariffs that are effective on or after this date
        schema:
          type: string
          format: date
      - name: toDateTime
        in: query
        description: Only include tariffs that are effective on or before this date
        schema:
          type: string
          format: date
      - name: customerClasses
        in: query
        description: 'Comma separated string that indicates the customer classes to include. Choices are: RESIDENTIAL, GENERAL, SPECIAL_USE'
        schema:
          type: string
      - name: chargeTypes
        in: query
        description: 'Comma separated string that indicates the charge types to include. Choices are: FIXED_PRICE, CONSUMPTION_BASED, DEMAND_BASED, QUANTITY, MINIMUM, TAX, NET_EXCESS_GENERATION'
        schema:
          type: string
      - name: tariffTypes
        in: query
        description: 'Comma separated string that indicates the tariff types to include. Choices are: DEFAULT, ALTERNATIVE, OPTIONAL_EXTRA, RIDER'
        schema:
          type: string
      - name: serviceTypes
        in: query
        description: 'Comma separated string that indicates the service types to include. Choices are: ELECTRICITY, SOLAR_PV, ‘GAS’ (default is all serviceTypes)'
        schema:
          type: string
      - name: privacyFlags
        in: query
        description: 'Comma separated string that indicates the privacy flags types to include. Only applicable if you publish private tariffs. Choices are: PUBLIC, UNLISTED, PRIVATE'
        schema:
          type: string
      - name: zipCode
        in: query
        description: (Optional but Recommended) Use this to return just the Tariffs that are for this given location. Most Tariffs apply for a regional, not national, geography.
        schema:
          type: string
      - name: postCode
        in: query
        description: Alias for zipCode. You can use either.
        schema:
          type: string
      - name: lat
        in: query
        description: (Optional) Represents the latitude of a geographical location. This should be paired with lng when not supplying a zip code or address.
        schema:
          type: number
          format: float
      - name: lng
        in: query
        description: (Optional) Represents the longitude of a geographical location. This should be paired with lat when not supplying a zip code or address.
        schema:
          type: number
          format: float
      - name: addressString
        in: query
        description: An alternative to using zipCode. Use this if you do not have the address parsed out in your app, but instead have a long string. For the best results this string will contain a zipcode or post code. If you do have the address split out it is better to use postCode.
        schema:
          type: string
      - name: riderId
        in: query
        description: When set to the masterTariffId of a Rider, this will return all of the tariffs that the rider is used on
        schema:
          type: integer
          format: int64
      - name: populateProperties
        in: query
        description: Populates the properties for the returned tariffs
        schema:
          type: boolean
      - name: populateRates
        in: query
        description: Populates the rate details for the returned tariffs
        schema:
          type: boolean
      - name: populateDocuments
        in: query
        description: Populates the document links for the returned tariffs
        schema:
          type: boolean
      - name: consumption
        in: query
        description: Return tariffs which are eligible for this consumption amount
        schema:
          type: number
          format: double
      - name: demand
        in: query
        description: Return tariffs which are eligible for this demand amount
        schema:
          type: number
          format: double
      - name: hasNetMetering
        in: query
        description: Return tariffs which have or do not have any net metered tariff rates
        schema:
          type: boolean
      - name: hasTimeOfUseRates
        in: query
        description: Return tariffs which have or do not have any time-of-use rates
        schema:
          type: boolean
