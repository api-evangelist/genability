  /rest/public/territories:
    get:
      summary: List Territories
      description: Return a full or filtered list of Territories.
      operationId: territory-1
      parameters:
      - name: zipCode
        in: query
        description: Filters the result to include only territories that this ZIP code is a part of.
        schema:
          type: string
      - name: postCode
        in: query
        description: Alias for zipCode, you can use either.
        schema:
          type: string
      - name: country
        in: query
        description: Recommended when passing in zipCode or postCode. We default this to US when zipCode or postCode is populated.
        schema:
          type: string
      - name: addressString
        in: query
        description: An address of any kind (e.g. San Francisco, CA, 94105, USA). Ideally this will contain a zipcode or post code, plus a country. Use this if you do not have the address parsed out in your app. If you do, its better to use postCode and country
        schema:
          type: string
      - name: address
        in: query
        description: Alias for addressString, you can use either.
        schema:
          type: string
      - name: lat
        in: query
        description: (Optional) Represents the latitude of a geographical location. This should be paired with lng when not supplying a zip code or address.
        schema:
          type: number
          format: float
      - name: lng
        in: query
        description: (Optional) Represents the longitude of a geographical location. This should be paired with lat when not supplying a zip code or address.
        schema:
          type: number
          format: float
      - name: lseId
        in: query
        description: Filters the result set to only include territories within this LSE ID
        schema:
          type: integer
          format: int32
      - name: populateItems
        in: query
        description: If true, this returns a list of territory items for each territory in the result set.
        schema:
          type: boolean
          default: false
      - name: masterTariffId
        in: query
        description: For tariffs with prices varying by geographic location, this will return the list of those territories covered by this tariff. 3% of all tariffs have territory based pricing and those are typically in CA, NY and MA. For the 97% of tariffs that do not have territory based pricing, the result set will be empty.
        schema:
          type: integer
          format: int32
      - name: usageTypes
        in: query
        description: Result will include territories of the specified usageType. If not set the results will be limited to those of usage type "SERVICE" or "TARIFF".
        schema:
          type: string
      - name: populateLses
        in: query
        description: If true, this returns a list of territory LSEs which are all the LSEs providing service in this territory.
        schema:
          type: boolean
          default: false
      - name: containsItemType
        in: query
        description: 'Filters by the type of the territory items in each territory and must appear with containsItemValue. Possible values are: STATE, COUNTY, CITY, and ZIPCODE.'
        schema:
          type: string
      - name: containsItemValue
        in: query
        description: Filters by the value of the territory items in each territory and must appear with containsItemType.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Rest
