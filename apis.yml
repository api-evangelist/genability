aid: genability
url: https://raw.githubusercontent.com/api-evangelist/genability/refs/heads/main/apis.yml
name: Genability
kind: company
description: >-
  Genability is a United States energy-data platform, based in San Francisco and
  now part of Arcadia, that sells programmatic access to North American
  electricity tariff data and a bill-calculation engine. Its Signal API — served
  from api.genability.com and documented as "Arcadia Platform - Signal" — covers
  electricity utilities, tariffs, territories, seasons, time-of-use definitions,
  calendars, utility taxes and typical-usage baselines across the USA, Canada and
  Mexico, plus on-demand and mass cost calculations used for solar savings
  analysis, storage dispatch, EV charging economics, procurement and bill
  auditing. Genability sits in the private, commercial layer of the energy value
  chain: it is not a utility, not a retailer and not a designated data holder
  under any consumer-energy-data mandate, so no Green Button, ESPI, CDR or other
  energy data standard is referenced anywhere in its documentation. Its API
  posture is honestly "self-serve but entirely closed data": a developer can sign
  up at dash.genability.com in minutes, but every endpoint — including the ones
  pathed /rest/public/ — returns 401 without an appId/appKey, so none of this
  tariff or market reference data is openly published, and Genability exposes no
  individual customer's usage or billing data at all (that consumer-data surface
  lives in Arcadia's separate Plug/Arc API).
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
