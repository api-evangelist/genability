- aid: genability:genability-signal-tariff-api
  name: Genability Signal Tariff API
  description: >-
    Search and retrieve North American electricity tariffs, including rate
    structures, applicability properties, documents and the effective-dated
    history of a master tariff. The list endpoint exposes 33 documented query
    parameters for filtering by utility, territory, customer class, service type,
    tariff type and effective date.
  humanURL: https://docs.arcadia.com/v2022-12-21-Signal/reference/tariff
  baseURL: https://api.genability.com
  tags:
  - Tariffs
  - Energy Rates
  - Electricity
